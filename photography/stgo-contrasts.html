<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santiago, in Contrast, Mitchell Langley</title>
<meta name="description" content="A photographic essay of Santiago, Chile, sequenced across four movements.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../assets/site.css">

<style id="stgo-gsap-essay-styles">
  html { scroll-behavior: auto; }
  body.essay-stgo-page { overflow-x: hidden; }

  .essay-stgo-page .page {
    width: 100%;
    max-width: none;
    margin: 0;
    padding: 0;
    overflow: clip;
  }

  .essay-stgo-page .stgo-movement {
    position: relative;
    height: calc(100svh - var(--stgo-header-height, 0px));
    min-height: 36rem;
    overflow: hidden;
  }

  /* Default light theme colors for movements 1 and 2 */
  .essay-stgo-page .stgo-movement[data-movement="1"],
  .essay-stgo-page .stgo-movement[data-movement="2"] {
    --movement-fg: var(--text-body, #1A1A1A);
    --movement-muted: #4a4a4a;
    --movement-rule: rgba(0, 0, 0, 0.12);
  }

  /* Dark theme colors for movements 3 and 4 */
  .essay-stgo-page .stgo-movement[data-movement="3"],
  .essay-stgo-page .stgo-movement[data-movement="4"] {
    --movement-fg: var(--white, #fff);
    --movement-muted: rgba(255, 255, 255, .88);
    --movement-rule: rgba(255, 255, 255, .22);
    --focus-ring: var(--white, #fff);
  }

  /* Movement 1: Lightest Neutral Grey Tier (7 frames) */
  .essay-stgo-page .stgo-movement[data-movement="1"] .stgo-frame:nth-child(1) { background: #f8f8f8; }
  .essay-stgo-page .stgo-movement[data-movement="1"] .stgo-frame:nth-child(2) { background: #f2f2f2; }
  .essay-stgo-page .stgo-movement[data-movement="1"] .stgo-frame:nth-child(3) { background: #ececec; }
  .essay-stgo-page .stgo-movement[data-movement="1"] .stgo-frame:nth-child(4) { background: #e6e6e6; }
  .essay-stgo-page .stgo-movement[data-movement="1"] .stgo-frame:nth-child(5) { background: #e0e0e0; }
  .essay-stgo-page .stgo-movement[data-movement="1"] .stgo-frame:nth-child(6) { background: #dadada; }
  .essay-stgo-page .stgo-movement[data-movement="1"] .stgo-frame:nth-child(7) { background: #d4d4d4; }

  /* Movement 2: Medium-Light Neutral Grey Tier (6 frames) */
  .essay-stgo-page .stgo-movement[data-movement="2"] .stgo-frame:nth-child(1) { background: #cbcbcb; }
  .essay-stgo-page .stgo-movement[data-movement="2"] .stgo-frame:nth-child(2) { background: #c2c2c2; }
  .essay-stgo-page .stgo-movement[data-movement="2"] .stgo-frame:nth-child(3) { background: #b9b9b9; }
  .essay-stgo-page .stgo-movement[data-movement="2"] .stgo-frame:nth-child(4) { background: #b0b0b0; }
  .essay-stgo-page .stgo-movement[data-movement="2"] .stgo-frame:nth-child(5) { background: #a7a7a7; }
  .essay-stgo-page .stgo-movement[data-movement="2"] .stgo-frame:nth-child(6) { background: #9e9e9e; }

  /* Movement 3: Darker Neutral Grey Tier (5 frames) */
  .essay-stgo-page .stgo-movement[data-movement="3"] .stgo-frame:nth-child(1) { background: #7b7b7b; }
  .essay-stgo-page .stgo-movement[data-movement="3"] .stgo-frame:nth-child(2) { background: #707070; }
  .essay-stgo-page .stgo-movement[data-movement="3"] .stgo-frame:nth-child(3) { background: #656565; }
  .essay-stgo-page .stgo-movement[data-movement="3"] .stgo-frame:nth-child(4) { background: #5a5a5a; }
  .essay-stgo-page .stgo-movement[data-movement="3"] .stgo-frame:nth-child(5) { background: #4f4f4f; }

  /* Movement 4: Darkest Charcoal Tier (4 frames) */
  .essay-stgo-page .stgo-movement[data-movement="4"] .stgo-frame:nth-child(1) { background: #3d3d3d; }
  .essay-stgo-page .stgo-movement[data-movement="4"] .stgo-frame:nth-child(2) { background: #303030; }
  .essay-stgo-page .stgo-movement[data-movement="4"] .stgo-frame:nth-child(3) { background: #232323; }
  .essay-stgo-page .stgo-movement[data-movement="4"] .stgo-frame:nth-child(4) { background: #161616; }

  .essay-stgo-page .stgo-movement > .rail {
    position: relative;
    width: 100%;
    max-width: none;
    height: 100%;
    margin: 0;
    padding: 0;
  }

  .essay-stgo-page .stgo-track {
    display: flex;
    flex-wrap: nowrap;
    width: 100%;
    height: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
  }

.essay-stgo-page .stgo-frame {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 4.5rem max(var(--gutter, 20px), calc((100vw - var(--content-max, 1100px)) / 2)) 6rem;
    display: grid;
    /* Change this line: */
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); 
    gap: var(--s5, 24px);
    align-items: center;
    scroll-snap-align: start;
    color: var(--movement-fg);
  }

  .essay-stgo-page .stgo-photo {
    width: 100%;
    height: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .essay-stgo-page .stgo-photo img {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    min-height: 0;
    object-fit: contain;
    object-position: center;
    transform-origin: center;
    border-radius: var(--radius-md, 12px);
  }

  .essay-stgo-page .stgo-caption {
    min-width: 0;
    max-height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
  }
  .essay-stgo-page .stgo-caption > * { margin: 0; }
  .essay-stgo-page .stgo-caption > :empty { display: none; }

.essay-stgo-page .stgo-caption-text {
    font-family: var(--font-serif, Georgia, serif);
    font-size: 1.15rem; /* Reduced from var(--text-subtitle, 1.3rem) */
    font-style: italic;
    line-height: 1.5;   /* Tightened from var(--leading-body, 1.6) */
    color: var(--movement-fg);
  }

.essay-stgo-page .stgo-caption-translation {
    margin-top: var(--s2, 8px);
    font-family: var(--font-serif, Georgia, serif);
    font-size: 0.95rem; /* Reduced from var(--text-body-size, 1.05rem) */
    font-style: italic;
    line-height: 1.4;
    color: #606060;
  }

  .essay-stgo-page .stgo-movement[data-movement="3"] .stgo-caption-translation,
  .essay-stgo-page .stgo-movement[data-movement="4"] .stgo-caption-translation {
    color: #c9c9c9;
  }

  .essay-stgo-page .stgo-caption-credit {
    margin-top: var(--s5, 24px);
    padding-top: var(--s4, 16px);
    border-top: 1px solid var(--movement-rule);
    font-size: var(--text-small, .9rem);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    line-height: 1.5;
    color: var(--movement-muted);
  }

.essay-stgo-page .stgo-context {
    margin-top: var(--s4, 16px); /* Reduced margin-top slightly */
    font-size: 0.95rem;          /* Reduced from var(--text-body-size, 1.05rem) */
    line-height: 1.45;           /* Tightened from var(--leading-body, 1.6) */
    color: var(--movement-fg);
  }

/* Place colophon: pin in the gutter, name on top, comuna and coordinates inline below. */
  .essay-stgo-page .stgo-place {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    margin-top: var(--s5, 24px);
    padding-left: 1.5rem;
    font-size: var(--text-small, .9rem);
    line-height: 1.45;
    color: var(--movement-muted);
  }
  .essay-stgo-page .stgo-place svg {
    position: absolute;
    left: 0;
    top: .15em;
    width: 1rem;
    height: 1rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
  }
  .essay-stgo-page .stgo-place-name {
    display: block;
    width: 100%;
    font-weight: 600;
    color: var(--movement-fg);
  }
  .essay-stgo-page .stgo-place-comuna {
    display: inline;
  }
  .essay-stgo-page .stgo-place-comuna::after {
    content: "·";
    margin-left: 0.5rem;
    margin-right: 0.5rem;
    color: var(--movement-muted);
  }
  .essay-stgo-page .stgo-place-coords {
    display: inline;
    margin-top: 0;
    font-variant-numeric: tabular-nums;
    color: inherit;
    text-decoration-line: underline;
    text-decoration-color: var(--movement-rule);
    text-underline-offset: 3px;
  }
  .essay-stgo-page .stgo-place-coords:hover { text-decoration-color: currentColor; }

  html.stgo-drafts .stgo-caption > :empty {
    display: block;
    padding: var(--s2, 8px) var(--s3, 12px);
    border: 1px dashed var(--movement-rule);
    border-radius: var(--radius-sm, 5px);
    font-family: var(--font-sans, Arial, sans-serif);
    font-size: var(--text-small, .9rem);
    font-style: normal;
    color: var(--movement-muted);
  }
  html.stgo-drafts .stgo-caption-translation:empty::before { content: "English translation of the lyric"; }
  html.stgo-drafts .stgo-context:empty::before { content: "English context, a sentence or short paragraph"; }
  html.stgo-drafts .stgo-place:empty::before { content: "Location, comuna and coordinates missing from the data"; }

  .essay-stgo-page .stgo-controls {
    position: absolute;
    z-index: 6;
    right: max(var(--gutter, 20px), calc((100% - var(--content-max, 1100px)) / 2));
    bottom: var(--s5, 24px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--s3, 12px);
  }

  .essay-stgo-page .stgo-progress-count {
    min-width: 4rem;
    text-align: center;
    font-size: var(--text-small, .9rem);
    font-variant-numeric: tabular-nums;
    color: var(--movement-muted);
  }

  .essay-stgo-page .stgo-arrow {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid var(--movement-muted);
    border-radius: var(--radius-sm, 5px);
    background: var(--color-primary, #1D3F5C);
    color: var(--white, #fff);
    cursor: pointer;
    transition: background var(--dur-fast, 140ms), border-color var(--dur-fast, 140ms);
  }

  .essay-stgo-page .stgo-arrow:hover:not(:disabled) {
    background: var(--color-primary-hover, #3D6485);
    border-color: var(--color-primary-hover, #3D6485);
  }

  .essay-stgo-page .stgo-arrow:disabled {
    background: transparent;
    border-color: var(--movement-rule);
    color: var(--movement-muted);
    cursor: default;
  }

  .essay-stgo-page .stgo-arrow svg { width: 20px; height: 20px; }

  @media (max-width: 640px) {
    .essay-stgo-page .stgo-movement { min-height: 40rem; }
    .essay-stgo-page .stgo-frame {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      gap: var(--s5, 24px);
      padding-top: 5rem;
    }
    .essay-stgo-page .stgo-caption { max-height: 48svh; }
    .essay-stgo-page .stgo-caption-credit { margin-top: var(--s3, 12px); padding-top: var(--s3, 12px); }
    .essay-stgo-page .stgo-caption-translation,
    .essay-stgo-page .stgo-context { font-size: var(--text-small, .9rem); }
    .essay-stgo-page .stgo-context,
    .essay-stgo-page .stgo-place { margin-top: var(--s4, 16px); }
  }

  html.stgo-deck,
  .stgo-deck body.essay-stgo-page { height: 100%; overflow: hidden; }
  .stgo-deck .essay-stgo-page .site-footer { display: none; }
  .stgo-deck .essay-stgo-page .stgo-movement { min-height: 0; }
  .stgo-deck .essay-stgo-page .stgo-movement[hidden],
  .stgo-deck .essay-stgo-page .stgo-frame[hidden] { display: none; }
  .stgo-deck .essay-stgo-page .stgo-track {
    display: block;
    overflow: hidden;
    scroll-snap-type: none;
  }
  .stgo-deck .essay-stgo-page .stgo-frame { grid-template-rows: minmax(0, 1fr); }
  @media (prefers-reduced-motion: no-preference) {
    .stgo-deck .stgo-frame:not([hidden]) .stgo-photo,
    .stgo-deck .stgo-frame:not([hidden]) .stgo-caption {
      animation: stgo-reveal 420ms var(--ease-out, ease-out) both;
    }
  }
  @keyframes stgo-reveal {
    from { opacity: 0; transform: translateX(var(--stgo-reveal-offset, 20px)); }
    to { opacity: 1; transform: translateX(0); }
  }
  @media (max-width: 640px) {
    .stgo-deck .essay-stgo-page .stgo-frame {
      grid-template-rows: minmax(0, 1fr) auto;
      padding-top: var(--s5, 24px);
      gap: var(--s4, 16px);
    }
    .stgo-deck .essay-stgo-page .stgo-caption {
      max-height: min(48svh, calc((100svh - var(--stgo-header-height, 0px) - 9rem) * .65));
    }
  }
</style>

<main id="main" class="page">

  <section class="stgo-movement" data-movement="1" aria-label="The Face It Shows First">
    <div class="rail" data-movement-title="The Face It Shows First">
      <div class="stgo-track">

        <figure class="stgo-frame" style="--ar: 1.3333;">
          <div class="stgo-photo">
            <img src="../assets/photography/stgo-contrasts/bandera-plaza.webp" alt="" width="1600" height="1200" loading="eager" fetchpriority="high" decoding="async">
          </div>
          <figcaption class="stgo-caption">
            <p class="stgo-caption-text" lang="es">Llegué a Santiago provinciano y Martín Rivas...</p>
            <p class="stgo-caption-translation">I came to Santiago as an outsider like Martín Rivas...</p>
            <p class="stgo-caption-credit" lang="es">Manuel García · La gran ciudad</p>
            <p class="stgo-context">Martín Rivas is the protagonist of Alberto Blest Gana's classic 1862 novel, a provincial man arriving in Santiago to start a new life. The massive Bicentennial Flag represent the imposing apparatus that greets newcomers.</p>
            <p class="stgo-place">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 15s5-4.6 5-8.6A5 5 0 0 0 3 6.4C3 10.4 8 15 8 15Z"/><circle cx="8" cy="6.4" r="1.7"/></svg>
              <span class="stgo-place-name" lang="es">Plaza de la Ciudadanía / Bandera Bicentenario</span>
              <span class="stgo-place-comuna" lang="es">Santiago Centro</span>
              <a class="stgo-place-coords" href="https://www.google.com/maps/search/?api=1&amp;query=-33.4438,-70.65378" target="_blank" rel="noopener" aria-label="33.4438° S, 70.6538° W, open in Google Maps (new tab)">33.4438° S, 70.6538° W</a>
            </p>
          </figcaption>
        </figure>

        <figure class="stgo-frame" style="--ar: 1.3333;">
          <div class="stgo-photo">
            <img src="../assets/photography/stgo-contrasts/fountain-inside-la-moneda.webp" alt="" width="1600" height="1200" loading="eager" fetchpriority="high" decoding="async">
          </div>
          <figcaption class="stgo-caption">
            <p class="stgo-caption-text" lang="es">Dicen que el tiempo guarda en sus bastillas las cosas que el hombre olvidó...</p>
            <p class="stgo-caption-translation">They say time keeps within its hems the things mankind forgot...</p>
            <p class="stgo-caption-credit" lang="es">Fernando Ubiergo · El tiempo en las bastillas</p>
            <p class="stgo-context">The inner courtyards of La Moneda, Chile's presidential palace, project a serene continuity that contrasts with the building's turbulent political history.</p>
            <p class="stgo-place">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 15s5-4.6 5-8.6A5 5 0 0 0 3 6.4C3 10.4 8 15 8 15Z"/><circle cx="8" cy="6.4" r="1.7"/></svg>
              <span class="stgo-place-name" lang="es">Patio de los Naranjos, La Moneda</span>
              <span class="stgo-place-comuna" lang="es">Santiago Centro</span>
              <a class="stgo-place-coords" href="https://www.google.com/maps/search/?api=1&amp;query=-33.44305,-70.65388" target="_blank" rel="noopener" aria-label="33.4430° S, 70.6539° W, open in Google Maps (new tab)">33.4430° S, 70.6539° W</a>
            </p>
          </figcaption>
        </figure>

        <figure class="stgo-frame" style="--ar: 0.75;">
          <div class="stgo-photo">
            <img src="../assets/photography/stgo-contrasts/colonial.webp" alt="" width="960" height="1280" loading="lazy" decoding="async">
          </div>
          <figcaption class="stgo-caption">
            <p class="stgo-caption-text" lang="es">Quién me ayudaría a desarmar tu historia antigua, y a pedazos volverte a conquistar...</p>
            <p class="stgo-caption-translation">Who would help me take apart your ancient past, and piece by piece win you back again...</p>
            <p class="stgo-caption-credit" lang="es">Santiago del Nuevo Extremo · A mi ciudad</p>
            <p class="stgo-context">Colonial estates like this one in Las Condes have been absorbed by the sprawling metropolis, standing as manicured relics of a bygone agrarian era amid the modern city.</p>
            <p class="stgo-place">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 15s5-4.6 5-8.6A5 5 0 0 0 3 6.4C3 10.4 8 15 8 15Z"/><circle cx="8" cy="6.4" r="1.7"/></svg>
              <span class="stgo-place-name" lang="es">Centro Cultural Las Condes (ex-Casona Chacra El Rosario)</span>
              <span class="stgo-place-comuna" lang="es">Las Condes</span>
              <a class="stgo-place-coords" href="https://www.google.com/maps/search/?api=1&amp;query=-33.40619,-70.5618" target="_blank" rel="noopener" aria-label="33.40619° S, 70.5618° W, open in Google Maps (new tab)">33.40619° S, 70.5618° W</a>
            </p>
          </figcaption>
        </figure>

        <figure class="stgo-frame" style="--ar: 1.3333;">
          <div class="stgo-photo">
            <img src="../assets/photography/stgo-contrasts/monumento-manuel-rodriguez.webp" alt="" width="1600" height="1200" loading="lazy" decoding="async">
          </div>
          <figcaption class="stgo-caption">
            <p class="stgo-caption-text" lang="es">Yo no sé si volveré a verlo libre y gentil. Solo sé que sonreía camino a Til-Til.</p>
            <p class="stgo-caption-translation">I don't know if I'll see him free and noble once more; all I know is that he went with a smile on his way to Til-Til.</p>
            <p class="stgo-caption-credit" lang="es">Patricio Manns · El cautivo de Til-Til</p>
            <p class="stgo-context">Manuel Rodríguez, a mythologized guerrilla hero of Chilean independence, was assassinated near this spot in Til-Til. He remains a potent symbol of national identity and popular resistance.</p>
            <p class="stgo-place">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 15s5-4.6 5-8.6A5 5 0 0 0 3 6.4C3 10.4 8 15 8 15Z"/><circle cx="8" cy="6.4" r="1.7"/></svg>
              <span class="stgo-place-name" lang="es">Monumento a Manuel Rodríguez (Camino a Til-Til)</span>
              <span class="stgo-place-comuna" lang="es">Til-Til</span>
              <a class="stgo-place-coords" href="https://www.google.com/maps/search/?api=1&amp;query=-33.1153,-70.9269" target="_blank" rel="noopener" aria-label="33.1153° S, 70.9269° W, open in Google Maps (new tab)">33.1153° S, 70.9269° W</a>
            </p>
          </figcaption>
        </figure>

        <figure class="stgo-frame" style="--ar: 0.75;">
          <div class="stgo-photo">
            <img src="../assets/photography/stgo-contrasts/portales-statue.webp" alt="" width="960" height="1280" loading="lazy" decoding="async">
          </div>
          <figcaption class="stgo-caption">
            <p class="stgo-caption-text" lang="es">Santiago del ochocientos, para poderte mirar...</p>
            <p class="stgo-caption-translation">19th century Santiago, if I could look upon you...</p>
            <p class="stgo-caption-credit" lang="es">Violeta Parra · Santiago, penando estás</p>
            <p class="stgo-context">Diego Portales was the austere architect of the 1833 Constitution, establishing the centralized state order that fundamentally shaped Chile's institutional character.</p>
            <p class="stgo-place">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 15s5-4.6 5-8.6A5 5 0 0 0 3 6.4C3 10.4 8 15 8 15Z"/><circle cx="8" cy="6.4" r="1.7"/></svg>
              <span class="stgo-place-name" lang="es">Estatua de Diego Portales, Plaza de la Constitución</span>
              <span class="stgo-place-comuna" lang="es">Santiago Centro</span>
              <a class="stgo-place-coords" href="https://www.google.com/maps/search/?api=1&amp;query=-33.44129,-70.65412" target="_blank" rel="noopener" aria-label="33.4413° S, 70.6541° W, open in Google Maps (new tab)">33.4413° S, 70.6541° W</a>
            </p>
          </figcaption>

<script>
(() => {
  if (new URLSearchParams(location.search).has('drafts')) document.documentElement.classList.add('stgo-drafts');
  const header = document.querySelector('.doc-head');
  const updateHeader = () => document.documentElement.style.setProperty('--stgo-header-height', header.getBoundingClientRect().height + 'px');
  const movements = Array.from(document.querySelectorAll('.stgo-movement'));
  let activeMovement = 0;
  const galleries = movements.map((movement, movementIndex) => {
    const rail = movement.querySelector(':scope > .rail');
    const track = movement.querySelector('.stgo-track');
    const panels = Array.from(track.querySelectorAll('.stgo-frame'));
    track.id = 'stgo-track-' + (movementIndex + 1);
    const controls = document.createElement('div');
    controls.className = 'stgo-controls';
    controls.setAttribute('role', 'group');
    controls.setAttribute('aria-label', movement.getAttribute('aria-label') + ': photograph navigation');
    controls.innerHTML = `
      <button class="stgo-arrow" type="button" aria-label="Previous photograph" aria-controls="${track.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 5-7 7 7 7M7 12h14"/></svg>
      </button>
      <span class="stgo-progress-count" aria-live="polite" aria-atomic="true"></span>
      <button class="stgo-arrow" type="button" aria-label="Next photograph" aria-controls="${track.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m10 5 7 7-7 7M3 12h14"/></svg>
      </button>`;
    rail.appendChild(controls);
    const [previous, next] = controls.querySelectorAll('button');
    const count = controls.querySelector('.stgo-progress-count');
    previous.addEventListener('click', () => navigate(-1));
    next.addEventListener('click', () => navigate(1));
    return { movement, panels, previous, next, count, active: 0 };
  });

  function show(movementIndex, index, direction = 1) {
    activeMovement = movementIndex;
    galleries.forEach((gallery, i) => {
      gallery.movement.hidden = i !== movementIndex;
      gallery.panels.forEach((panel, j) => { panel.hidden = i !== movementIndex || j !== index; });
    });
    const gallery = galleries[movementIndex];
    gallery.active = index;
    gallery.movement.style.setProperty('--stgo-reveal-offset', (direction * 20) + 'px');
    gallery.count.textContent = String(index + 1).padStart(2, '0') + ' / ' + String(gallery.panels.length).padStart(2, '0');
    gallery.previous.disabled = movementIndex === 0 && index === 0;
    gallery.next.disabled = movementIndex === galleries.length - 1 && index === gallery.panels.length - 1;
    gallery.panels[index].querySelector('.stgo-caption').scrollTop = 0;
    const upcoming = gallery.panels[index + 1] || galleries[movementIndex + 1]?.panels[0];
    if (upcoming) upcoming.querySelector('img').loading = 'eager';
  }

  function navigate(direction) {
    let movementIndex = activeMovement;
    const current = galleries[movementIndex];
    let index = current.active + direction;
    const moveFocus = current.movement.contains(document.activeElement);
    if (index < 0 || index >= current.panels.length) {
      movementIndex += direction;
      if (!galleries[movementIndex]) return;
      index = direction > 0 ? 0 : galleries[movementIndex].panels.length - 1;
    }
    show(movementIndex, index, direction);
    if (moveFocus) {
      const gallery = galleries[movementIndex];
      let button = direction > 0 ? gallery.next : gallery.previous;
      if (button.disabled) button = direction > 0 ? gallery.previous : gallery.next;
      button.focus({ preventScroll: true });
    }
  }

  document.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight'].includes(event.key) || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
    if (event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    event.preventDefault();
    navigate(event.key === 'ArrowRight' ? 1 : -1);
  });

  document.documentElement.classList.add('stgo-deck');
  updateHeader();
  show(0, 0);
  window.addEventListener('resize', updateHeader);
  if ('ResizeObserver' in window) new ResizeObserver(updateHeader).observe(header);
})();
</script>
