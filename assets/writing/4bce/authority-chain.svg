<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="702" viewBox="0 0 640 702" role="img" aria-labelledby="title desc">
<title id="title">Proposed chain of authority</title>
<desc id="desc">A proposed hierarchy for direct Roman rule with Augustan safeguards. Central imperial authority under Augustus, followed by the Legate of Syria, the Prefect of Judaea, and indigenous civic, judicial, and high-priestly institutions. Arrows indicate descending authority.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#813919" stroke-width="1.8"/></marker></defs>
<rect width="640" height="702" fill="#ffffff"/>
<g font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif"><text x="24" y="34" fill="#813919" font-size="18" font-weight="700"><tspan x="24" dy="0">FIGURE 1</tspan></text><text x="24" y="75" fill="#1d3f5c" font-size="29" font-weight="600"><tspan x="24" dy="0">Proposed chain of authority</tspan></text><text x="24" y="108" fill="#535b65" font-size="21" font-weight="400"><tspan x="24" dy="0">Direct Roman rule with Augustan safeguards</tspan></text><path d="M24 130H616" stroke="#d8dce0"/><rect x="80" y="159" width="536" height="94" rx="2" fill="#1d3f5c" stroke="#1d3f5c" stroke-width="1.4"/><text x="24" y="213" fill="#68717b" font-size="20" font-weight="400"><tspan x="24" dy="0">01</tspan></text><text x="104" y="196" fill="#fff" font-size="27" font-weight="600"><tspan x="104" dy="0">Central imperial authority</tspan></text><text x="104" y="229" fill="#fff" font-size="23" font-weight="400"><tspan x="104" dy="0">Augustus</tspan></text><path d="M348 253V275" fill="none" stroke="#813919" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="283" width="536" height="94" rx="2" fill="#f4f6f8" stroke="#c7cfd6" stroke-width="1.4"/><text x="24" y="337" fill="#68717b" font-size="20" font-weight="400"><tspan x="24" dy="0">02</tspan></text><text x="104" y="340" fill="#1d3f5c" font-size="27" font-weight="600"><tspan x="104" dy="0">Legate of Syria</tspan></text><path d="M348 377V399" fill="none" stroke="#813919" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="407" width="536" height="94" rx="2" fill="#f4f6f8" stroke="#c7cfd6" stroke-width="1.4"/><text x="24" y="461" fill="#68717b" font-size="20" font-weight="400"><tspan x="24" dy="0">03</tspan></text><text x="104" y="464" fill="#1d3f5c" font-size="27" font-weight="600"><tspan x="104" dy="0">Prefect of Judaea</tspan></text><path d="M348 501V523" fill="none" stroke="#813919" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="531" width="536" height="94" rx="2" fill="#faf4f0" stroke="#813919" stroke-width="1.4"/><text x="24" y="585" fill="#68717b" font-size="20" font-weight="400"><tspan x="24" dy="0">04</tspan></text><text x="104" y="568" fill="#813919" font-size="27" font-weight="600"><tspan x="104" dy="0">Indigenous institutions</tspan></text><text x="104" y="601" fill="#813919" font-size="23" font-weight="400"><tspan x="104" dy="0">Civic, judicial, and high-priestly</tspan></text><path d="M24 654H616" stroke="#d8dce0"/><text x="24" y="684" fill="#535b65" font-size="20" font-weight="400"><tspan x="24" dy="0">Arrows indicate descending authority.</tspan></text></g></svg>
