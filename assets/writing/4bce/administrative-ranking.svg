<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="830" viewBox="0 0 640 830" role="img" aria-labelledby="title desc">
<title id="title">Relative preference among administrative alternatives</title>
<desc id="desc">Qualitative ranking from the essay. Syrian incorporation with broad indigenous autonomy is slightly preferred to safeguarded direct Roman rule. Those first two alternatives are closely ranked, and implementation could reverse their order. Both are preferred to a unified Antipas monarchy, which is preferred to the historical Archelaus-to-annexation sequence. This is not a numerical probability or casualty estimate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#813919" stroke-width="1.8"/></marker></defs>
<rect width="640" height="830" fill="#ffffff"/>
<g font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif"><text x="24" y="34" fill="#813919" font-size="18" font-weight="700"><tspan x="24" dy="0">FIGURE 2</tspan></text><text x="24" y="75" fill="#1d3f5c" font-size="29" font-weight="600"><tspan x="24" dy="0">Administrative alternatives</tspan></text><text x="24" y="108" fill="#535b65" font-size="21" font-weight="400"><tspan x="24" dy="0">Qualitative order of preference</tspan></text><path d="M24 130H616" stroke="#d8dce0"/><rect x="24" y="158" width="592" height="339" rx="2" fill="#faf4f0" stroke="#813919" stroke-width="1.4"/><text x="44" y="190" fill="#813919" font-size="18" font-weight="700"><tspan x="44" dy="0">CLOSELY RANKED</tspan></text><text x="44" y="239" fill="#813919" font-size="30" font-weight="600"><tspan x="44" dy="0">1</tspan></text><text x="92" y="233" fill="#1d3f5c" font-size="26" font-weight="600"><tspan x="92" dy="0">Syrian incorporation with</tspan><tspan x="92" dy="33">broad indigenous autonomy</tspan></text><text x="92" y="305" fill="#813919" font-size="21" font-weight="400"><tspan x="92" dy="0">Slight preference</tspan></text><path d="M44 329H596" stroke="#dfc9bc"/><text x="44" y="379" fill="#813919" font-size="30" font-weight="600"><tspan x="44" dy="0">2</tspan></text><text x="92" y="373" fill="#1d3f5c" font-size="26" font-weight="600"><tspan x="92" dy="0">Safeguarded direct</tspan><tspan x="92" dy="33">Roman rule</tspan></text><text x="92" y="445" fill="#535b65" font-size="21" font-weight="400"><tspan x="92" dy="0">Implementation could reverse</tspan></text><text x="92" y="472" fill="#535b65" font-size="21" font-weight="400"><tspan x="92" dy="0">the order of the first two options.</tspan></text><path d="M54 509V526" stroke="#813919" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="541" width="592" height="91" rx="2" fill="#f4f6f8" stroke="#c7cfd6" stroke-width="1.4"/><text x="44" y="588" fill="#68717b" font-size="30" font-weight="600"><tspan x="44" dy="0">3</tspan></text><text x="92" y="578" fill="#1d3f5c" font-size="26" font-weight="600"><tspan x="92" dy="0">Unified Antipas monarchy</tspan></text><text x="92" y="609" fill="#535b65" font-size="21" font-weight="400"><tspan x="92" dy="0">Below both institutional alternatives</tspan></text><path d="M54 644V661" stroke="#813919" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24" y="677" width="592" height="91" rx="2" fill="#f4f6f8" stroke="#c7cfd6" stroke-width="1.4"/><text x="44" y="728" fill="#68717b" font-size="30" font-weight="600"><tspan x="44" dy="0">4</tspan></text><text x="92" y="714" fill="#1d3f5c" font-size="26" font-weight="600"><tspan x="92" dy="0">Historical Archelaus-to-</tspan></text><text x="92" y="747" fill="#1d3f5c" font-size="26" font-weight="600"><tspan x="92" dy="0">annexation sequence</tspan></text><path d="M24 790H616" stroke="#d8dce0"/><text x="24" y="819" fill="#535b65" font-size="20" font-weight="400"><tspan x="24" dy="0">Relative preference; no numerical estimates.</tspan></text></g></svg>
