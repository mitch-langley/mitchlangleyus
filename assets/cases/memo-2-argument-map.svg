<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Legal memorandum argument map</title><desc id="desc">Question presented: may a regional government grant a supplemental operating subsidy to a transit operator already under contract? Three authorities, each with a translated excerpt: the funding statute authorizes operating subsidies, the implementing regulation requires execution through a mandate agreement, and the procurement statute's tender requirement is met by the existing award. The memorandum answers an objection that the mechanism was drafted for public works, and concludes that no new procurement is required, provided that technical validation precedes disbursement and the funds are executed through a mandate agreement.</desc>
<rect x="0" y="0" width="1600" height="1100" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="80" y="72" font-family="Calibri, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="2" fill="#1e405a">LEGAL MEMORANDUM | ARGUMENT MAP</text>
<text x="80" y="140" font-family="Georgia, serif" font-size="49" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1e405a">Supplemental subsidy under an existing contract</text>
<path d="M80 170L1520 170" fill="none" stroke="#1e405a" stroke-width="3"/>
<path d="M80 177L1520 177" fill="none" stroke="#1e405a" stroke-width="1"/>

<text x="80" y="220" font-family="Calibri, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="2" fill="#527b96">QUESTION PRESENTED</text>
<text x="80" y="258" font-family="Georgia, serif" font-size="28" font-style="italic" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">May a regional government grant a supplemental operating subsidy to an operator already under contract?</text>

<rect x="80" y="284" width="1440" height="114" fill="#f2f5f7" stroke="none" stroke-width="1"/>
<text x="105" y="318" font-family="Calibri, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="2" fill="#1e405a">ANTICIPATED OBJECTION</text>
<text x="105" y="354" font-family="Calibri, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">Article 16 of Law No. 18,091 was drafted for</text>
<text x="105" y="384" font-family="Calibri, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">public works, not recurring operating subsidies.</text>
<path d="M745 360L815 360" fill="none" stroke="#527b96" stroke-width="3"/>
<path d="M803 352 L815 360 L803 368" fill="none" stroke="#527b96" stroke-width="3"/>
<text x="860" y="318" font-family="Calibri, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="2" fill="#1e405a">RESPONSE</text>
<text x="860" y="354" font-family="Calibri, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">Later statute and regulation expressly adopt its</text>
<text x="860" y="384" font-family="Calibri, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">mechanism; the Comptroller General did not object.</text>

<path d="M80 430L520 430" fill="none" stroke="#1e405a" stroke-width="3"/>
<text x="80" y="462" font-family="Calibri, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="2" fill="#527b96">A · STATUTE</text>
<text x="80" y="500" font-family="Calibri, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1e405a">The statute authorizes</text>
<text x="80" y="533" font-family="Calibri, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1e405a">operating subsidies</text>
<path d="M81 556L81 646" fill="none" stroke="#cfd7dd" stroke-width="3"/>
<text x="100" y="576" font-family="Georgia, serif" font-size="23" font-style="italic" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">“…Regional Governments shall define</text>
<text x="100" y="606" font-family="Georgia, serif" font-size="23" font-style="italic" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">the services that may be financed…,</text>
<text x="100" y="636" font-family="Georgia, serif" font-size="23" font-style="italic" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">subject to prior technical validation…”</text>
<text x="80" y="682" font-family="Calibri, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#63717c">Law No. 20,378, Trans. Art. 4, ¶ 1,</text>
<text x="80" y="707" font-family="Calibri, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#63717c">as amended by Law No. 21,692</text>
<path d="M300 722L300 740" fill="none" stroke="#527b96" stroke-width="2"/>

<path d="M580 430L1020 430" fill="none" stroke="#1e405a" stroke-width="3"/>
<text x="580" y="462" font-family="Calibri, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="2" fill="#527b96">B · REGULATION</text>
<text x="580" y="500" font-family="Calibri, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1e405a">A mandate agreement</text>
<text x="580" y="533" font-family="Calibri, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1e405a">must execute the funds</text>
<path d="M581 556L581 646" fill="none" stroke="#cfd7dd" stroke-width="3"/>
<text x="600" y="576" font-family="Georgia, serif" font-size="23" font-style="italic" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">“…once technical validation is made,</text>
<text x="600" y="606" font-family="Georgia, serif" font-size="23" font-style="italic" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">the Regional Government… shall enter</text>
<text x="600" y="636" font-family="Georgia, serif" font-size="23" font-style="italic" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">into mandate agreements…”</text>
<text x="580" y="682" font-family="Calibri, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#63717c">Supreme Decree No. 112 (2025),</text>
<text x="580" y="707" font-family="Calibri, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#63717c">Arts. 5–6</text>
<path d="M800 722L800 740" fill="none" stroke="#527b96" stroke-width="2"/>

<path d="M1080 430L1520 430" fill="none" stroke="#1e405a" stroke-width="3"/>
<text x="1080" y="462" font-family="Calibri, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="2" fill="#527b96">C · PROCUREMENT STATUTE</text>
<text x="1080" y="500" font-family="Calibri, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1e405a">The existing award meets</text>
<text x="1080" y="533" font-family="Calibri, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1e405a">the tender requirement</text>
<path d="M1081 556L1081 646" fill="none" stroke="#cfd7dd" stroke-width="3"/>
<text x="1100" y="576" font-family="Georgia, serif" font-size="23" font-style="italic" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">“…directly with the natural or legal</text>
<text x="1100" y="606" font-family="Georgia, serif" font-size="23" font-style="italic" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">person that has been awarded</text>
<text x="1100" y="636" font-family="Georgia, serif" font-size="23" font-style="italic" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442">the respective tender…”</text>
<text x="1080" y="682" font-family="Calibri, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#63717c">Law No. 18,091, Art. 16, ¶ 2; prior</text>
<text x="1080" y="707" font-family="Calibri, sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0" fill="#63717c">award and approved assignment</text>
<path d="M1300 722L1300 740" fill="none" stroke="#527b96" stroke-width="2"/>

<path d="M300 740L1300 740" fill="none" stroke="#527b96" stroke-width="2"/>
<path d="M800 740L800 763" fill="none" stroke="#527b96" stroke-width="2"/>
<path d="M792 752 L800 764 L808 752" fill="none" stroke="#527b96" stroke-width="2"/>

<rect x="80" y="776" width="1440" height="170" fill="#1e405a" stroke="none" stroke-width="1"/>
<text x="105" y="812" font-family="Calibri, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="2" fill="#ffffff">CONCLUSION</text>
<text x="105" y="856" font-family="Calibri, sans-serif" font-size="33" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ffffff">No new procurement is required, provided that:</text>
<text x="105" y="896" font-family="Calibri, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ffffff">(i) technical validation by the Ministry precedes disbursement; and</text>
<text x="105" y="928" font-family="Calibri, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ffffff">(ii) the funds are executed through a mandate agreement with the Ministry.</text>

<text x="80" y="982" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#243442"><tspan font-weight="700" fill="#1e405a">Recommendation: </tspan>the agreement should expressly recite its statutory basis and authorized purpose.</text>
</svg>
