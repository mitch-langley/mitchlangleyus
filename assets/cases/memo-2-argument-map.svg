<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Supplemental operating subsidies: legal argument map</title>
  <desc id="desc">The memorandum asks whether supplemental operating support under an existing transit contract requires a new procurement. It applies statutory funding authority, ministry execution requirements, and the prior award and approved assignment. Its opinion is that a new procurement is unnecessary, subject to the prescribed approvals, execution agreement and authorized purpose.</desc>
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M-4 4L4 -4 M0 16L16 0 M12 20L20 12" stroke="#94aabb" stroke-width="2" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="1600" height="1100" fill="#ffffff" stroke="none" stroke-width="1" />
  <g aria-hidden="true">
    <rect x="80" y="430" width="440" height="316" fill="#f4f6f8" />
    <rect x="580" y="430" width="440" height="316" fill="#f4f6f8" />
    <rect x="1080" y="430" width="440" height="316" fill="#f4f6f8" />
    <path d="M80 982H1520" fill="none" stroke="#d8dce0" stroke-width="2" />
  </g>
  <text x="80" y="72" font-family="Calibri, sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="2.2" fill="#3d6485" style="font-variant-numeric:tabular-nums lining-nums">STATUTORY INTERPRETATION &amp; PROCUREMENT LAW ANALYSIS</text>
  <text x="80" y="140" font-family="Georgia, serif" font-size="49" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1d3f5c" style="font-variant-numeric:tabular-nums lining-nums">Supplemental subsidies under an existing contract</text>
  <path d="M80 170L1520 170" fill="none" stroke="#1d3f5c" stroke-width="3" />
  <path d="M80 177L1520 177" fill="none" stroke="#1d3f5c" stroke-width="1" />
  <text x="80" y="220" font-family="Calibri, sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="2" fill="#3d6485" style="font-variant-numeric:tabular-nums lining-nums">QUESTION PRESENTED</text>
  <text x="80" y="258" font-family="Georgia, serif" font-size="28" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">Does supplemental operating support under the existing contract require a new procurement?</text>
  <rect x="80" y="284" width="1440" height="114" fill="#e8eef3" stroke="none" stroke-width="1" />
  <text x="105" y="318" font-family="Calibri, sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="2" fill="#1d3f5c" style="font-variant-numeric:tabular-nums lining-nums">INTERPRETIVE OBSTACLE</text>
  <text x="105" y="354" font-family="Calibri, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">Article 16 was enacted for public works,</text>
  <text x="105" y="384" font-family="Calibri, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">rather than recurring operating subsidies.</text>
  <path d="M745 360L815 360" fill="none" stroke="#3d6485" stroke-width="3" />
  <path d="M803 352 L815 360 L803 368" fill="none" stroke="#3d6485" stroke-width="3" />
  <text x="860" y="318" font-family="Calibri, sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="2" fill="#1d3f5c" style="font-variant-numeric:tabular-nums lining-nums">MEMORANDUM'S RESPONSE</text>
  <text x="860" y="354" font-family="Calibri, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">Later provisions incorporate its procedure,</text>
  <text x="860" y="384" font-family="Calibri, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">subject to the fund's authorized purposes.</text>
  <path d="M80 430L520 430" fill="none" stroke="#1d3f5c" stroke-width="3" />
  <text x="98.0" y="462" font-family="Calibri, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing=".5" fill="#3d6485" style="font-variant-numeric:tabular-nums lining-nums">1 · FUNDING AUTHORITY</text>
  <text x="98.0" y="500" font-family="Calibri, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1d3f5c" style="font-variant-numeric:tabular-nums lining-nums">The service falls within</text>
  <text x="98.0" y="533" font-family="Calibri, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1d3f5c" style="font-variant-numeric:tabular-nums lining-nums">the statutory funding power</text>
  <text x="98.0" y="577" font-family="Calibri, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0" fill="#626e79" style="font-variant-numeric:tabular-nums lining-nums">Law No. 20,378, fourth transitory art.,</text>
  <text x="98.0" y="603" font-family="Calibri, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0" fill="#626e79" style="font-variant-numeric:tabular-nums lining-nums">No. 1, as amended by Law No. 21,692.</text>
  <text x="98.0" y="637" font-family="Calibri, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing=".5" fill="#3d6485" style="font-variant-numeric:tabular-nums lining-nums">APPLICATION</text>
  <text x="98.0" y="674" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">The existing service falls within</text>
  <text x="98.0" y="704" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">the regulated-service category</text>
  <text x="98.0" y="734" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">eligible for operating support.</text>
  <path d="M300 747L300 767" fill="none" stroke="#3d6485" stroke-width="2" />
  <path d="M580 430L1020 430" fill="none" stroke="#1d3f5c" stroke-width="3" />
  <text x="598.0" y="462" font-family="Calibri, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing=".5" fill="#3d6485" style="font-variant-numeric:tabular-nums lining-nums">2 · EXECUTION REQUIREMENTS</text>
  <text x="598.0" y="500" font-family="Calibri, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1d3f5c" style="font-variant-numeric:tabular-nums lining-nums">The ministry must act</text>
  <text x="598.0" y="533" font-family="Calibri, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1d3f5c" style="font-variant-numeric:tabular-nums lining-nums">as the executing agency</text>
  <text x="598.0" y="577" font-family="Calibri, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0" fill="#626e79" style="font-variant-numeric:tabular-nums lining-nums">Supreme Decree No. 112/2025, arts. 5 and 6;</text>
  <text x="598.0" y="603" font-family="Calibri, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0" fill="#626e79" style="font-variant-numeric:tabular-nums lining-nums">Law No. 18,091, art. 16.</text>
  <text x="598.0" y="637" font-family="Calibri, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing=".5" fill="#3d6485" style="font-variant-numeric:tabular-nums lining-nums">APPLICATION</text>
  <text x="598.0" y="674" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">Prior technical validation and</text>
  <text x="598.0" y="704" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">an interagency agreement are</text>
  <text x="598.0" y="734" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">required before disbursement.</text>
  <path d="M800 747L800 767" fill="none" stroke="#3d6485" stroke-width="2" />
  <path d="M1080 430L1520 430" fill="none" stroke="#1d3f5c" stroke-width="3" />
  <text x="1098.0" y="462" font-family="Calibri, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing=".5" fill="#3d6485" style="font-variant-numeric:tabular-nums lining-nums">3 · PRIOR AWARD &amp; ASSIGNMENT</text>
  <text x="1098.0" y="500" font-family="Calibri, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1d3f5c" style="font-variant-numeric:tabular-nums lining-nums">The prior award can satisfy</text>
  <text x="1098.0" y="533" font-family="Calibri, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1d3f5c" style="font-variant-numeric:tabular-nums lining-nums">the procurement requirement</text>
  <text x="1098.0" y="577" font-family="Calibri, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0" fill="#626e79" style="font-variant-numeric:tabular-nums lining-nums">Law No. 18,091, art. 16, para. 2.</text>
  <text x="1098.0" y="637" font-family="Calibri, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing=".5" fill="#3d6485" style="font-variant-numeric:tabular-nums lining-nums">APPLICATION</text>
  <text x="1098.0" y="674" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">The memo treats the existing award</text>
  <text x="1098.0" y="704" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">and approved assignment as the</text>
  <text x="1098.0" y="734" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">basis for the proposed support.</text>
  <path d="M1300 747L1300 767" fill="none" stroke="#3d6485" stroke-width="2" />
  <path d="M300 767L1300 767" fill="none" stroke="#3d6485" stroke-width="2" />
  <path d="M800 767L800 792" fill="none" stroke="#3d6485" stroke-width="2" />
  <path d="M792 781 L800 793 L808 781" fill="none" stroke="#3d6485" stroke-width="2" />
  <rect x="80" y="806" width="1440" height="150" fill="#1d3f5c" stroke="none" stroke-width="1" />
  <text x="105" y="842" font-family="Calibri, sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="2" fill="#ffffff" style="font-variant-numeric:tabular-nums lining-nums">MEMORANDUM'S OPINION</text>
  <text x="105" y="884" font-family="Calibri, sans-serif" font-size="33" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ffffff" style="font-variant-numeric:tabular-nums lining-nums">The existing award satisfies the procurement requirement.</text>
  <text x="105" y="924" font-family="Calibri, sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0" fill="#ffffff" style="font-variant-numeric:tabular-nums lining-nums">Subject to prior technical validation, an interagency execution agreement and an authorized purpose.</text>
  <text x="80" y="1012" font-family="Calibri, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0" fill="#283b4a" style="font-variant-numeric:tabular-nums lining-nums">Recommendation: expressly recite the statutory basis and authorized purpose in the agreement.</text>
  <g aria-hidden="true">
    <rect x="80" y="30" width="64" height="4" fill="#1d3f5c" />
    <path d="M158 32H1520" fill="none" stroke="#d8dce0" stroke-width="1" />
    <text x="1520" y="72" font-family="Calibri, sans-serif" font-size="21" font-weight="700" text-anchor="end" letter-spacing="2" fill="#626e79">FIG. 04</text>
    <path d="M80 177H200" fill="none" stroke="#1d3f5c" stroke-width="4" />
  </g>
</svg>
