<text x="440.0" y="345" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#63717c">0%</text>
<path d="M695.0 365L695.0 638" fill="none" stroke="#cfd7dd" stroke-width="1"/>
<text x="695.0" y="345" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#63717c">25%</text>
<path d="M950.0 365L950.0 638" fill="none" stroke="#cfd7dd" stroke-width="1"/>
<text x="950.0" y="345" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#63717c">50%</text>
<path d="M1205.0 365L1205.0 638" fill="none" stroke="#cfd7dd" stroke-width="1"/>
<text x="1205.0" y="345" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#63717c">75%</text>
<path d="M1460.0 365L1460.0 638" fill="none" stroke="#cfd7dd" stroke-width="1"/>
<text x="1460.0" y="345" font-family="Calibri, sans-serif" font-size="23" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#63717c">100%</text>
<text x="80" y="437" font-family="Calibri, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1e405a">Selected applications</text>
<rect x="440" y="392" width="48.57142857142857" height="68" fill="#1e405a" stroke="none" stroke-width="1"/>
<text x="508.57142857142856" y="439" font-family="Calibri, sans-serif" font-size="38" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1e405a">5%</text>
<text x="80" y="585" font-family="Calibri, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0" fill="#1e405a">Waitlisted applications</text>
