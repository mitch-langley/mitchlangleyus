<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">Fleet replacement subsidy priorities</title><desc id="desc">The city accounts for about 5 percent of reported urban selections and 76 percent of urban waitlist entries. The first retirement cohort represents 19 percent of its registered fleet and the following cohort 4 percent. The groups use different denominators.</desc>
<defs><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M-4 4L4 -4 M0 16L16 0 M12 20L20 12" stroke="#94aabb" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="1600" height="1100" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="80" y="80" font-family="Calibri, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="2" fill="#1e405a">REGULATORY &amp; POLICY ANALYSIS</text>
<text x="80" y="155" font-family="Georgia, serif" font-size="49" font-weight="400" text-anchor="start" letter-spacing="0" fill="#1e405a">The city accounted for most of the waitlist</text>
<path d="M80 195L1520 195" fill="none" stroke="#cfd7dd" stroke-width="2"/>
<text x="80" y="252" font-family="Calibri, sans-serif" font-size="29" font-weight="400" text-anchor="start" letter-spacing="0" fill="#63717c">City's share of each reported urban application group</text>
